name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type Check (TS7 native)
        run: pnpm run typecheck
      - name: Unit Tests
        run: pnpm run test
      - name: Build All
        run: pnpm run build:all

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build prototypes (preview targets)
        run: |
          pnpm --filter @atl/proto-vue-three build
          pnpm --filter @atl/proto-automotive-studio build
          pnpm --filter @atl/proto-design-playground build
          pnpm --filter @atl/proto-delorean-showcase build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E Smoke
        run: pnpm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
