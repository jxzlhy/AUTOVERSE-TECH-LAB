<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%2305070D%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22none%22 stroke=%22%2322D3EE%22 stroke-width=%222.5%22/%3E%3C/svg%3E" />
    <title>ATL Design Playground · CORE UI v0</title>
  </head>
  <body>
    <script>
    window.__bootErr = [];
    window.addEventListener("error", function (e) { window.__bootErr.push(String(e.message) + " @" + (e.filename || "").slice(-40) + ":" + e.lineno); });
    window.addEventListener("unhandledrejection", function (e) { window.__bootErr.push("REJ:" + String(e.reason && e.reason.message || e.reason)); });
    var _err = console.error.bind(console);
    console.error = function () { window.__bootErr.push("CE:" + Array.from(arguments).map(String).join(" ").slice(0, 300)); _err.apply(console, arguments); };
    var _warn = console.warn.bind(console);
    console.warn = function () { window.__bootErr.push("CW:" + Array.from(arguments).map(String).join(" ").slice(0, 200)); _warn.apply(console, arguments); };
  </script>
  <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
